# To install deps from toml
# -------------------------
# > pip install .[dev] && pip uninstall .
# OR
# > make install
#
# To push to github
# -------------------------
# See Workflow.md

# NOTE: Fix PySide6 xcb plugin error on linux by installing: sudo apt install libxcb-cursor0

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChoiceTask"
version = "2026.11.3.3"
description = "ChoiceTask: Simple 4-Color Choice Task For MHP Class."
authors = [{ name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["education", "psychology", "experiment", "cognitive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]
dependencies = [
    "pyside6-essentials>=6.6.0,<6.9.0",
    "pygame-ce>=2.4.0,<3.0.0",
    "loguru>=0.7.0,<1.0.0"
]

[project.urls]
"Bug Tracker" = "https://github.com/travisseymour/choicetask/issues"
"Documentation" = "https://github.com/travisseymour/choicetask#readme"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "build",
    "check-manifest",

]

[project.scripts]
choicetask = "choicetask.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["choicetask"]  # Include only the 'choicetask' package
namespaces = false

# pull in any files defined in MANIFEST.in use with importlib.resources
[tool.setuptools]
include-package-data = true


[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F821", "F841", "E722"]  # undefined name, assigned but unused variable, bare except